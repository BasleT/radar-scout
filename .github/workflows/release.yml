name: release-clients

# Builds the Android debug-signed APK and the Windows .exe (installer + portable exe) and attaches them to a
# GitHub release. Trigger: push a tag like v0.1.0, or run manually (then set a tag name).
# NOTE: the APK is signed with the Android DEBUG key, so it can be sideloaded but is not a Play Store build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create/update (e.g. v0.1.0)
        required: true
      server_url:
        description: Default server URL baked into the apps (can still be changed in-app)
        required: false
        default: ""

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  VITE_DEFAULT_SERVER: ${{ github.event.inputs.server_url || vars.DEFAULT_SERVER_URL || '/data' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: viewer/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "viewer/src-tauri" }
      - name: Build debug APK (arm64)
        working-directory: viewer
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export NDK_HOME="$ANDROID_NDK_HOME"
          npm ci --no-audit --no-fund
          npx tauri android build --debug --apk --target aarch64
      - name: Collect APK
        run: |
          mkdir -p out
          find viewer/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print
          cp "$(find viewer/src-tauri/gen/android/app/build/outputs/apk -name '*debug*.apk' | head -n1)" out/radar-scout-${TAG}-android-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: viewer/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "viewer/src-tauri" }
      - name: Build (NSIS installer + portable exe)
        working-directory: viewer
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npx tauri build
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item viewer/src-tauri/target/release/bundle/nsis/*.exe "out/radar-scout-$env:TAG-windows-setup.exe"
          $exe = Get-ChildItem viewer/src-tauri/target/release -Filter *.exe | Where-Object { $_.Name -notmatch "build|setup" } | Select-Object -First 1
          if (-not $exe) { throw "portable exe not found" }
          Copy-Item $exe.FullName "out/radar-scout-$env:TAG-windows-portable.exe"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/*.exe }

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --prerelease \
              --notes "Clients only. Android APK is debug-signed (sideload). Not validated for scientific use; see SCIENTIFIC_LIMITATIONS.md and docs/VALIDATION_STATUS.md."
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
