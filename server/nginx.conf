server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types application/json application/octet-stream application/javascript text/css;
  gzip_min_length 1024;

  # Engine artifacts. CORS is open because clients (Tauri on Android/Windows) load from other origins; the
  # data are public NOAA products and this host is meant to be reachable on LAN/Tailscale only.
  location /data/ {
    alias /var/radar/web/;
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "no-store" always;
    types { application/json json; application/octet-stream bin; }
  }
  location / { try_files $uri $uri/ /index.html; }
}
