# Tolerances, fixed BEFORE the first comparison run (VALIDATION_PLAN section 4).
# Each entry states its basis. Changing a value requires a separate commit with a scientific justification.
raw_N_mismatch_count:
  value: 0
  unit: gates
  basis: Integers; any difference is a decoding error.
dbz_from_N:
  value: 1.0e-9
  unit: dB
  basis: float64 evaluation of (N-66)/2; exactly representable, so any larger difference is a bug.
angle_vs_file:
  value: 0.0
  unit: deg
  basis: Real*4 values widened to float64 exactly; compared for equality.
beam_height_same_model:
  value: 1.0e-6
  unit: m
  basis: float64 evaluation of the identical closed form vs 40-digit mpmath reference (cancellation-free form used in engine).
ground_arc_same_model:
  value: 1.0e-6
  unit: m
  basis: same as beam_height_same_model.
horizontal_position_same_ellipsoid:
  value: 0.01
  unit: m
  basis: Both PROJ and GeographicLib implement Karney's geodesic algorithm to nanometre-level accuracy; 1 cm is a loose bound that still catches unit, sign and azimuth-convention bugs.
cross_library_height_same_parameters:
  value: 1.0e-6
  unit: m
  basis: Py-ART / wradlib evaluate the same formula with the same R; only float rounding should differ. A larger value is reported as a finding, not tuned away.
echo_top_same_definition:
  value: 1.0e-6
  unit: m
  basis: Identical gates and identical formula.
geoid_vs_second_model_sanity:
  value: 2.0
  unit: m
  basis: Sanity bound only (EGM2008 vs EGM96 differ by decimetres to ~1 m over CONUS). Not an independent validation.
wradlib_height_model_difference_bound:
  value: 1.0
  unit: m
  basis: Derived analytically from wradlib's source formula h = sqrt(r^2+(R+a)^2+2r(R+a)sin(t)) - R, which places the antenna at radius R+a (site altitude a inside the sphere) whereas the Doviak form used by Py-ART and this engine adds a afterwards. The difference is of order a*r^2/(2R^2) ~ 0.1-0.2 m for a<=400 m, r<=460 km; 1 m is a safe analytic upper bound. Reported as a data-processing difference, not an engine error.
wradlib_vs_own_formula_evaluation:
  value: 1.0e-6
  unit: m
  basis: wradlib vs 40-digit mpmath evaluation of wradlib's own documented formula; float64 rounding only.
pyart_spherical_horizontal_relative_bound:
  value: 0.004
  unit: fraction of ground arc
  basis: Py-ART places gates with a spherical azimuthal-equidistant inverse (R=6370997 m); this engine uses the WGS84 ellipsoidal geodesic. The expected fractional distance discrepancy is bounded by roughly the WGS84 flattening f=1/298.257 (0.34%), so 0.4% is an a-priori upper bound. Reported as a data-processing difference (SCIENTIFIC_LIMITATIONS L10).
